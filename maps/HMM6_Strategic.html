predator around.\nSeems uninterested by our kind.", "details": [["Sublevel", "HMM6_BreathingWorld"], ["World X / Y / Z", "34265 / 95005 / 5434"]], "extra": "", "x": 297.9, "y": -968.8}, {"title": "Dragonfly", "cat": "wildlife", "icon": "assets/UI_Bestiary_Dragonfly.png", "img": "assets/UI_Screen_Dragonfly.jpg", "text": "Silent predator.\nHunts small creatures, faster than any other predator around.\nSeems uninterested by our kind.", "details": [["Sublevel", "HMM6_BreathingWorld"], ["World X / Y / Z", "65774 / 78477 / 2217"]], "extra": "", "x": 1170.0, "y": -511.4}, {"title": "Slug (spawner)", "cat": "wildlife", "icon": "assets/UI_Bestiary_Slug.png", "img": "assets/UI_Screen_Slug.jpg", "text": "Lesser creature, lesser snail.\nSlimy, slow, idiotic.\nEasy prey.", "details": [["Sublevel", "HMM6_BreathingWorld"], ["World X / Y / Z", "42450 / 75548 / 2830"]], "extra": "", "x": 524.4, "y": -430.3}, {"title": "Bumblebee (swarm)", "cat": "wildlife", "icon": "assets/UI_Bestiary_Bumblebee.png", "img": "assets/UI_Screen_Bumblebee.jpg", "text": "Lesser fluffy creature.\nFlies from flower to flower to collect nectar and feed its colony.\nGentle and noisy animals, not to be disturbed.", "details": [["Sublevel", "HMM6_BreathingWorld"], ["World X / Y / Z", "34440 / 98588 / 26956"]], "extra": "", "x": 302.8, "y": -1067.9}, {"title": "Jumping Spider", "cat": "wildlife", "icon": "assets/UI_Bestiary_JumpingSpider.png", "img": "assets/UI_Screen_Spider_Jumping.jpg", "text": "Surprising predator.\nUsing its legs to jump and hop, it hunts quickly.\nBe on your guard at all times.", "details": [["Sublevel", "HMM6_BreathingWorld"], ["World X / Y / Z", "46214 / 82897 / 2954"]], "extra": "", "x": 628.6, "y": -633.7}, {"title": "Jumping Spider", "cat": "wildlife", "icon": "assets/UI_Bestiary_JumpingSpider.png", "img": "assets/UI_Screen_Spider_Jumping.jpg", "text": "Surprising predator.\nUsing its legs to jump and hop, it hunts quickly.\nBe on your guard at all times.", "details": [["Sublevel", "H const CATS = [{"id": "start", "label": "Start position", "color": "#4aa3ff"}, {"id": "checkpoint", "label": "Checkpoints", "color": "#7fd1ff"}, {"id": "quest", "label": "Quest givers", "color": "#2ecc71"}, {"id": "golden", "label": "Golden beetles", "color": "#ffd700"}, {"id": "butterfly", "label": "Collectible butterflies", "color": "#ff8fd1"}, {"id": "collect", "label": "Lost sisters / aphids", "color": "#ff6fb5"}, {"id": "poi", "label": "Points of interest (scans)", "color": "#b07cff"}, {"id": "nest", "label": "Nests", "color": "#9a9a9a"}, {"id": "forage", "label": "Foraging spots", "color": "#3aa655"}, {"id": "resource", "label": "Large resources", "color": "#f2c230"}, {"id": "predator", "label": "Predators & beasts", "color": "#e74c3c"}, {"id": "wildlife", "label": "Wildlife", "color": "#e67e22"}];
const map = L.map('map', {crs: L.CRS.Simple, minZoom: -2, maxZoom: 4, zoomSnap: 0.25, attributionControl: false});
const B = [[-1024, 0], [0, 1024]];
if (DATA.bg) L.imageOverlay(DATA.bg, B).addTo(map);
else {
  const overlays = {};
  if (DATA.terrain) overlays['Terrain relief'] = L.imageOverlay(DATA.terrain, B).addTo(map);
  const g = overlays['Grid'] = L.layerGroup().addTo(map);
  L.control.layers(null, overlays, {collapsed: false}).addTo(map);
  for (let i = 0; i <= 1024; i += 64) {
    L.polyline([[-i, 0], [-i, 1024]], {color: '#3a3226', weight: 1, interactive: false}).addTo(g);
    L.polyline([[0, i], [-1024, i]], {color: '#3a3226', weight: 1, interactive: false}).addTo(g);
  }
}
const layers = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
for (const c of CATS) layers[c.id] = L.layerGroup().addTo(map);
for (const m of DATA.markers) {
  const c = CATS.find(x => x.id === m.cat);
  const sz = m.cat === 'wildlife' ? 26 : 34;
  const icon = L.divIcon({className: '', iconSize: [sz, sz], iconAnchor: [sz/2, sz/2], popupAnchor: [0, -sz/2],
    html: `<div class="gi" style="--c:${m.ring || c.color};width:${sz-4}px;height:${sz-4}px;background-image:url('${m.icon || ''}')"></div>`});
  const rows = m.details.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  const html = `<div class="pp" style="--c:${c.color}"><div class="k">${esc(c.label)}</div>
    <h3>${m.icon ? `<img src="${m.icon}">` : ''}${esc(m.title)}</h3>
    ${m.img ? `<img class="shot" src="${m.img}">` : ''}${m.text ? `<div class="txt">${esc(m.text)}</div>` : ''}
    ${m.extra ? `<div class="dlg">${m.extra}</div>` : ''}<table>${rows}</table></div>`;
  L.marker([m.y, m.x], {icon, title: m.title, riseOnHover: true}).bindPopup(html, {maxWidth: 330}).bindTooltip(esc(m.title), {direction: 'top', offset: [0, -sz/2]}).addTo(layers[m.cat]);
}
const box = document.getElementById('cats');
for (const c of CATS) {
  const n = DATA.markers.filter(m => m.cat === c.id).length;
  if (!n) continue;
  const ic = (DATA.markers.find(m => m.cat === c.id && m.icon) || {}).icon || '';
  const el = document.createElement('div');
  el.className = 'cat'; el.style.setProperty('--c', c.color);
  el.innerHTML = `<img src="${ic}"><span>${esc(c.label)}</span><span class="n">${n}</span>`;
  el.onclick = () => { const on = map.hasLayer(layers[c.id]); on ? map.removeLayer(layers[c.id]) : map.addLayer(layers[c.id]); el.classList.toggle('off', on); };
  box.appendChild(el);
}
document.getElementById('all').onclick = () => { for (const c of CATS) map.addLayer(layers[c.id]); document.querySelectorAll('.cat').forEach(e => e.classList.remove('off')); };
document.getElementById('none').onclick = () => { for (const c of CATS) map.removeLayer(layers[c.id]); document.querySelectorAll('.cat').forEach(e => e.classList.add('off')); };
const pts = DATA.markers.map(m => [m.y, m.x]);
map.fitBounds(DATA.bg ? B : L.latLngBounds(pts).pad(0.08));
